<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RIPZ Raiders — TAKE YOUR SHOT!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --gold:#c9a227; --ink:#f5f5f5; }
  html, body { margin:0; padding:0; width:100%; height:100%; background:var(--bg); overflow:hidden; touch-action:none; font-family:Inter, system-ui, sans-serif; color:var(--ink); }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#111; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; background:#88c070; display:block; }
  #ui { position:absolute; bottom:6px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 10px 4px; pointer-events:none; z-index:10; }
  #dpad, #buttons { pointer-events:auto; }
  #dpad { display:grid; grid-template-columns:60px 60px 60px; grid-template-rows:60px 60px 60px; gap:3px; }
  #dpad button, #buttons button { width:60px; height:60px; font-size:22px; font-weight:700; background:#1a1a1a; color:#eee; border:3px solid #444; border-radius:12px; touch-action:manipulation; }
  #dpad button:active, #buttons button:active { background:#333; }
  #buttons { display:flex; gap:14px; align-items:center; }
  #buttons button.a { background:#2a5; }
  #buttons button.b { background:#a42; }
  #buttons button.s { background:#25a; width:78px; font-size:13px; }
  #dialog { position:absolute; bottom:110px; left:6px; right:6px; background:#000; color:#fff; border:4px solid var(--gold); padding:16px; font-size:16px; line-height:1.4; display:none; z-index:20; pointer-events:auto; }
  #menu, #battleMenu { position:absolute; background:#000; color:#fff; border:4px solid var(--gold); padding:6px; display:none; z-index:20; pointer-events:auto; }
  #menu { top:32px; right:10px; min-width:160px; }
  #battleMenu { bottom:110px; right:10px; min-width:150px; }
  #menu div, #battleMenu div { padding:12px 16px; font-size:16px; }
  #menu div.sel, #battleMenu div.sel { background:var(--gold); color:#000; }
  #hud { position:absolute; top:6px; left:6px; color:#fff; background:#000c; padding:4px 8px; font-size:12px; z-index:15; pointer-events:none; }
  #zoneFlash { position:absolute; top:40%; left:0; right:0; text-align:center; color:#fff; font-size:22px; font-weight:700; text-shadow:2px 2px #000; display:none; z-index:25; pointer-events:none; }
  #accountBar { position:absolute; top:6px; right:6px; z-index:30; font-size:13px; }
  #accountBar button { background:var(--gold); color:#000; border:none; padding:6px 10px; border-radius:6px; font-weight:600; cursor:pointer; }
  .kiosk #accountBar { display:none; }
  .kiosk body { cursor:none; }
</style>
</head>
<body>
<div id="accountBar"><button id="signInBtn">Sign in to ohhRIPZ</button></div>
<div id="wrap"><canvas id="c" width="160" height="144"></canvas></div>
<div id="hud">Score 0</div>
<div id="zoneFlash"></div>
<div id="ui">
  <div id="dpad">
    <div></div><button data-dir="up">▲</button><div></div>
    <button data-dir="left">◀</button><div></div><button data-dir="right">▶</button>
    <div></div><button data-dir="down">▼</button><div></div>
  </div>
  <div id="buttons">
    <button class="b" id="btnB">B</button>
    <button class="a" id="btnA">A</button>
    <button class="s" id="btnStart">MENU</button>
  </div>
</div>
<div id="dialog"></div>
<div id="menu"></div>
<div id="battleMenu"></div>
<script src="src/mode.js"></script>
<script src="src/account.js"></script>
<script src="src/game.js"></script>
</body>
</html>
