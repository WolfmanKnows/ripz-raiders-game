function getZone(){ return zones[currentZone]; }

// Classic Game Boy style box with double border
function drawGBBox(x, y, w, h) {
  ctx.fillStyle = GB.black;
  ctx.fillRect(x-4, y-4, w+8, h+8);
  ctx.fillStyle = GB.white;
  ctx.fillRect(x-2, y-2, w+4, h+4);
  ctx.fillStyle = GB.black;
  ctx.fillRect(x, y, w, 2);
  ctx.fillRect(x, y+h-2, w, 2);
  ctx.fillRect(x, y, 2, h);
  ctx.fillRect(x+w-2, y, 2, h);
  // Corner accents
  ctx.fillRect(x-2, y-2, 4, 4);
  ctx.fillRect(x+w-2, y-2, 4, 4);
  ctx.fillRect(x-2, y+h-2, 4, 4);
  ctx.fillRect(x+w-2, y+h-2, 4, 4);
}

function drawHPBar(x, y, w, hp, max) {
  ctx.fillStyle = GB.black;
  ctx.font = '8px monospace';
  ctx.fillText('HP', x, y);
  ctx.fillStyle = '#555';
  ctx.fillRect(x+16, y-6, w, 6);
  const f = Math.max(0, Math.min(w-2, ((hp/max)*(w-2))));
  let col = '#4caf50';
  if (hp/max < 0.5) col = '#ffeb3b';
  if (hp/max < 0.25) col = '#f44336';
  ctx.fillStyle = col;
  ctx.fillRect(x+17, y-5, Math.max(0, f), 4);
  ctx.fillStyle = GB.black;
  ctx.font = '7px monospace';
  ctx.fillText(hp+'/'+max, x+16+w+2, y);
}

// Improved tile drawing matching reference style
function drawTile(x, y, t) {
  const sx = x*TILE - camX, sy = y*TILE - camY;
  const map = {0:'grass',1:'path',2:'tree',3:'wall',4:'door',5:'tall'};
  const key = map[t];
  if (key && tileImgs[key] && tileImgs[key].complete) {
    ctx.drawImage(tileImgs[key], sx, sy, TILE, TILE);
    return;
  }
  // fallback colors
  const cols = {0:'#70b070',1:'#c8b888',2:'#308030',3:'#a09070',4:'#604020',5:'#50a050'};
  ctx.fillStyle = cols[t] || '#70b070';
  ctx.fillRect(sx, sy, TILE, TILE);
}

function drawWorld() {
  const z = getZone();
  const sx = Math.max(0, Math.floor(camX/TILE)), sy = Math.max(0, Math.floor(camY/TILE));
  const ex = Math.min(z.w, sx+VIEW_W+1), ey = Math.min(z.h, sy+VIEW_H+1);
  for (let y=sy; y<ey; y++) for (let x=sx; x<ex; x++) drawTile(x, y, z.map[y][x]);
  z.npcs.forEach(n => {
    if (n.battle && isDefeated(n.id)) return;
    const nx = n.x - camX, ny = n.y - camY;
    let key = 'npc_shop';
    if (n.name === 'Pat') key = 'npc_pat';
    else if (n.battle) key = 'npc_scalper';
    else if (n.name === 'Kid') key = 'npc_kid';
    if (tileImgs[key] && tileImgs[key].complete) {
      ctx.drawImage(tileImgs[key], nx, ny, TILE, TILE);
    } else {
      ctx.fillStyle = n.name === 'Pat' ? '#e74' : (n.battle ? '#333' : '#c9a227');
      ctx.fillRect(nx+4, ny+6, 8, 8);
    }
  });
  // Player
  if (tileImgs.player && tileImgs.player.complete) {
    ctx.drawImage(tileImgs.player, px-camX, py-camY, TILE, TILE);
  } else {
    ctx.fillStyle = '#888';
    ctx.fillRect(px+4-camX, py+6-camY, 8, 8);
    ctx.fillStyle = '#ffb6c1';
    ctx.fillRect(px+6-camX, py+4-camY, 4, 3);
  }
}

function wrap(str, max) {
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    if ((cur+' '+w).trim().length > max) { lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}

function drawDialog() {
  if (!inDialog) return;
  drawGBBox(8, 192, 304, 80);
  ctx.fillStyle = GB.black;
  ctx.font = '10px monospace';
  const lines = wrap(dialogQueue[dialogIndex] || '', 34);
  lines.forEach((ln, i) => ctx.fillText(ln, 16, 212 + i*14));
  if (dialogChoice) {
    ctx.fillText('▶ Yes', 16, 256);
    ctx.fillText('  No', 80, 256);
  } else {
    ctx.fillText('▼', 292, 260);
  }
}

function drawBattle() {
  if (!inBattle || !enemy) return;
  ctx.fillStyle = '#88c070';
  ctx.fillRect(0, 0, 320, 288);
  // Enemy box
  drawGBBox(170, 12, 136, 52);
  ctx.fillStyle = GB.black;
  ctx.font = '9px monospace';
  ctx.fillText(enemy.name, 180, 28);
  drawHPBar(180, 44, 70, enemy.hp, enemy.max);
  // Player box
  drawGBBox(8, 148, 148, 52);
  ctx.fillStyle = GB.black;
  ctx.font = '9px monospace';
  ctx.fillText(party[0].name, 18, 164);
  drawHPBar(18, 180, 80, party[0].hp, party[0].max);
  // Menu
  drawGBBox(160, 200, 148, 72);
  ctx.fillStyle = GB.black;
  ctx.font = '10px monospace';
  const opts = catchMode ? ['THROW BALL', 'ITEM', 'RUN'] : ['FIGHT', 'ITEM', 'RUN'];
  opts.forEach((o, i) => ctx.fillText((battleMenu===i?'▶ ':'  ')+o, 172, 220 + i*18));
  // Log
  drawGBBox(8, 200, 144, 72);
  ctx.fillStyle = GB.black;
  ctx.font = '9px monospace';
  wrap(enemy.log || '', 16).forEach((ln, i) => ctx.fillText(ln, 16, 220 + i*14));
}

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  if (inBattle) drawBattle();
  else { drawWorld(); if (inDialog) drawDialog(); }
}

function canMove(nx, ny) {
  const z = getZone();
  const tx = Math.floor(nx / TILE), ty = Math.floor(ny / TILE);
  if (tx < 0 || ty < 0 || tx >= z.w || ty >= z.h) return false;
  return !z.solid[z.map[ty][tx]];
}

function updateCamera() {
  const z = getZone();
  camX = Math.max(0, Math.min(px - c.width/2 + 8, z.w*TILE - c.width));
  camY = Math.max(0, Math.min(py - c.height/2 + 8, z.h*TILE - c.height));
}

  let nx = px, ny = py;
  const spd = 1.4;
  if (keys.ArrowLeft || keys.a) nx -= spd;
  if (keys.ArrowRight || keys.d) nx += spd;
  if (keys.ArrowUp || keys.w) ny -= spd;
  if (keys.ArrowDown || keys.s) ny += spd;
  if (canMove(nx, py)) px = nx;
  if (canMove(px, ny)) py = ny;
  updateCamera();
  const z = getZone();
  const tx = Math.floor(px/TILE), ty = Math.floor(py/TILE);
  if (z.map[ty] && z.map[ty][tx] === 5) {
    stepsInGrass++;
    if (stepsInGrass > 8 && Math.random() < 0.12 && z.wild) {
      stepsInGrass = 0;
      const mid = z.wild[Math.floor(Math.random()*z.wild.length)];
      startWild(mid);
    }
  } else stepsInGrass = 0;
  z.exits.forEach(ex => {
    if (Math.hypot(px - ex.x, py - ex.y) < 14) {
      currentZone = ex.to; px = ex.px; py = ex.py; updateCamera();
      document.getElementById('hud').textContent = zones[currentZone].name;
    }
  });
}

function interact() {
  if (inBattle) return;
  if (inDialog) { advanceDialog(); return; }
  const z = getZone();
  for (const n of z.npcs) {
    if (n.battle && isDefeated(n.id)) continue;
    const d = Math.hypot((px+8)-(n.x+8), (py+8)-(n.y+8));
    if (d < 28) {
      if (n.battle) startDialog(n.lines, () => startBattle(n));
      else if (n.choice) { dialogChoice = true; startDialog(n.lines, () => handleChoice(n)); }
      else startDialog(n.lines, () => { if (n.id === 'shop') setFlag('talkedShop'); });
      return;
    }
  }
  document.getElementById('hud').textContent = "Nothing here.";
}

function handleChoice(npc) {
  dialogChoice = false;
  if (npc.reward === 'moveTutor' && !moveTutorItem) {
    moveTutorItem = true;
    startDialog(["You chose to rip it!", "Pat hands you a Move Scroll."], null);
  } else startDialog(["Maybe next time."], null);
}

function startDialog(lines, after) {
  dialogQueue = lines; dialogIndex = 0; inDialog = true;
  window._after = after;
}

function advanceDialog() {
  if (dialogChoice) return;
  dialogIndex++;
  if (dialogIndex >= dialogQueue.length) {
    inDialog = false;
    if (window._after) window._after();
    window._after = null;
  }
}

function startWild(mid) {
  inBattle = true; catchMode = true; battleMenu = 0;
  const m = monsters[mid];
  enemy = { name: m.name, hp: m.hp, max: m.max, id: mid, log: "A wild " + m.name + " appeared!", mon: m };
}

function startBattle(npc) {
  inBattle = true; catchMode = false; battleMenu = 0;
  const m = monsters[npc.mon] || monsters.packrat;
  enemy = { name: m.name, hp: m.hp + (npc.boss?15:0), max: m.hp + (npc.boss?15:0), id: npc.id, boss: !!npc.boss, log: npc.reveal || "Scalper challenges you!", mon: m };
}

function battleSelect() {
  if (!inBattle) return;
  if (battleMenu === 0) {
    if (catchMode) {
      const chance = 0.35 + (1 - enemy.hp/enemy.max)*0.4;
      if (Math.random() < chance && party.length < 6) {
        party.push({...enemy.mon, hp: enemy.max, max: enemy.max});
        enemy.log = enemy.name + " was caught!";
        setTimeout(() => { inBattle = false; enemy = null; catchMode = false; }, 1200);
      } else enemy.log = "The ball missed!";
    } else {
      const dmg = 7 + Math.floor(Math.random()*6);
      enemy.hp -= dmg;
      enemy.log = party[0].name + " used " + (party[0].moves[0]||"Peck") + "! (" + dmg + ")";
      if (enemy.hp <= 0) {
        enemy.log = enemy.boss ? "Lead scalper defeated!" : "You win!";
        markDefeated(enemy.id);
        if (enemy.id === 'scalper1') setFlag('beat1');
        if (enemy.id === 'scalper2') setFlag('beat2');
        if (enemy.boss) setFlag('beatBoss');
        setTimeout(() => { inBattle = false; enemy = null; }, 1200);
        return;
      }
      setTimeout(() => {
        const ed = 5 + Math.floor(Math.random()*5) + (enemy.boss?3:0);
        party[0].hp -= ed;
        enemy.log = enemy.name + " attacks! (" + ed + ")";
        if (party[0].hp <= 0) {
          enemy.log = "Your monster fainted.";
          party[0].hp = Math.floor(party[0].max/2);
          setTimeout(() => { inBattle = false; enemy = null; }, 1200);
        }
      }, 400);
    }
  } else if (battleMenu === 1) {
    if (berries > 0) { berries--; party[0].hp = Math.min(party[0].max, party[0].hp + 16); enemy.log = "Used Nest Berry!"; }
    else enemy.log = "No Nest Berries!";
  } else {
    enemy.log = "Got away!";
    setTimeout(() => { inBattle = false; enemy = null; catchMode = false; }, 500);
  }
}

function openParty() {
  const names = party.map((p,i) => (i+1)+'. '+p.name+' '+p.hp+'/'+p.max).join(' | ');
  startDialog(["Party: "+names, "Berries: "+berries+"  Move Scroll: "+(moveTutorItem?'Yes':'No')], null);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') {
    if (inBattle) battleSelect();
    else interact();
  }
  if (e.key === 'm' || e.key === 'M') openParty();
  if (inBattle && (e.key === 'ArrowUp' || e.key === 'w')) battleMenu = Math.max(0, battleMenu-1);
  if (inBattle && (e.key === 'ArrowDown' || e.key === 's')) battleMenu = Math.min(2, battleMenu+1);
});
document.addEventListener('keyup', e => keys[e.key] = false);

function key(k, on) { keys[k] = !!on; }
if ('ontouchstart' in window) document.getElementById('touch').style.display = 'block';

updateObj();
loop();
</script>
</body>
</html>
