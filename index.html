<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIPZ Raiders — TAKE YOUR SHOT!</title>
<style>
  :root { --bg:#0a0a0c; --gold:#e8c547; --fg:#f4efe2; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Segoe UI","Liberation Sans",sans-serif; }
  .ripz-app { position:fixed; inset:0; display:flex; flex-direction:column; background:radial-gradient(ellipse at 50% 0%, #2a2412, #0a0a0c 55%); overflow:hidden; touch-action:none; user-select:none; }
  .ripz-stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering:pixelated; background:#07080c; border:3px solid var(--gold); border-radius:12px; box-shadow:0 0 32px #e8c54733; touch-action:none; }
  .ripz-splash { position:absolute; inset:0 0 108px; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .ripz-app.is-live .ripz-splash { opacity:0; }
  .eyebrow { letter-spacing:.42em; color:var(--gold); font-size:12px; margin:0; }
  h1 { font-family:Palatino, Georgia, serif; font-size:40px; margin:8px 0; }
  .tag { color:var(--gold); letter-spacing:.18em; font-weight:700; margin:0; }
  .ripz-card { position:absolute; top:10px; right:10px; z-index:6; }
  .ripz-card button { background:var(--gold); color:#141004; border:0; border-radius:999px; padding:8px 14px; font-weight:700; min-height:44px; }
  html.kiosk .ripz-card { display:none; }
  .ripz-touch { display:flex; justify-content:space-between; align-items:flex-end; padding:6px 12px calc(10px + env(safe-area-inset-bottom)); }
  .dpad { display:grid; grid-template-columns:64px 64px 64px; grid-template-rows:52px 52px 52px; gap:4px; }
  button { font-weight:800; color:var(--fg); background:#17160f; border:3px solid var(--gold); border-radius:14px; min-width:64px; min-height:48px; }
  .actions { display:flex; gap:10px; align-items:center; }
  .a, .b { border-radius:999px; }
  .a { min-width:72px; min-height:72px; background:#6e1220; }
  .b { background:#16324d; }
  .s { font-size:12px; }
</style>
</head>
<body>
<main class="ripz-app" id="ripzApp">
  <div class="ripz-splash"><p class="eyebrow">ohhRIPZ</p><h1>RIPZ RAIDERS</h1><p class="tag">TAKE YOUR SHOT!</p></div>
  <div class="ripz-stage" id="canvasWrap"><canvas id="c" width="960" height="640" tabindex="0"></canvas></div>
  <div class="ripz-card" id="accountBar"><button type="button" id="signInBtn">Owlie Card</button></div>
  <div class="ripz-touch">
    <div class="dpad" id="dpad">
      <span></span><button type="button" data-dir="up" aria-label="Up">▲</button><span></span>
      <button type="button" data-dir="left" aria-label="Left">◄</button><span></span><button type="button" data-dir="right" aria-label="Right">►</button>
      <span></span><button type="button" data-dir="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="actions">
      <button type="button" class="b" id="btnB">B</button>
      <button type="button" class="a" id="btnA">A</button>
      <button type="button" class="s" id="btnStart">MENU</button>
    </div>
  </div>
</main>
<script src="src/mode.js"></script>
<script src="src/account.js"></script>
<script src="src/data.js"></script>
<script src="src/audio.js"></script>
<script src="src/battle.js"></script>
<script src="src/art.js"></script>
<script src="src/maps.js"></script>
<script src="src/save.js"></script>
<script src="src/game.js"></script>
</body>
</html>
